[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ns3d-pinn"
version = "0.1.0"
description = "3D Incompressible Navier-Stokes PINN Research Framework on T^3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tensorboard>=2.15",
    "tqdm>=4.66",
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17"]
zarr = ["zarr>=2.18"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]
